<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 50" width="100%" height="50">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="35%" stop-color="#FF9100" />
      <stop offset="70%" stop-color="#FFC400" />
      <stop offset="100%" stop-color="#FF6D00" />
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .header-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: url(#titleGrad);
      filter: url(#glow);
    }
  </style>
  <text x="0" y="34" class="header-text">✦ %TITLE_TEXT%</text>
</svg>
