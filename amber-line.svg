<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="100%" height="8">
  <defs>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" stop-opacity="0" />
      <stop offset="25%" stop-color="#FF6D00" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#FFE082" stop-opacity="1" />
      <stop offset="75%" stop-color="#FF9100" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF3D00" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="1200" height="4" y="2" rx="2" fill="url(#laserGrad)" />
</svg>
